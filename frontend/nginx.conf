server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────────────
    # Defence-in-depth for the SPA. The Content-Security-Policy is the primary
    # mitigation that pairs with in-memory OIDC token storage (see frontend/src/auth.ts):
    # it blocks injected inline/remote scripts, so an XSS attempt cannot load an
    # attacker payload to read tokens from memory or exfiltrate them.
    #
    # connect-src / frame-src MUST list the browser-facing API and Keycloak origins.
    # These match the local deploy defaults (VITE_API_BASE_URL=http://localhost:8080,
    # VITE_OIDC_AUTHORITY on http://localhost:8081). If those build args change for
    # another environment, update the origins below to match, or this policy will
    # block the API calls and the Keycloak silent-renew iframe. frame-src also needs
    # 'self': the silent-renew iframe navigates to Keycloak and then back to the app's
    # own silent_redirect_uri (this origin) to complete the handshake. frame-ancestors
    # 'self' keeps clickjacking protection (no external site may embed the portal) while
    # still allowing that same-origin renew iframe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8080 http://localhost:8081; frame-src 'self' http://localhost:8081; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
