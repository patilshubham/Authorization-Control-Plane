name: authorization-control-plane

services:
  postgres:
    image: postgres:17-alpine
    container_name: acp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-authorization}
      POSTGRES_USER: ${POSTGRES_USER:-authorization}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authorization_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-authorization} -d ${POSTGRES_DB:-authorization}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: acp-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_HTTP_PORT: 8080
      # Fix the public issuer so tokens minted for the browser (localhost:8081) validate
      # consistently, while back-channel discovery/JWKS stays reachable on the Docker network.
      KC_HOSTNAME: ${Portal__OidcAuthorityBase:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  api:
    image: authorization-control-plane-api:local
    container_name: acp-api
    build:
      context: ../..
      dockerfile: backend/src/Authorization.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres}
      Oidc__Authority: ${Oidc__Authority}
      Oidc__Audience: ${Oidc__Audience}
      Oidc__PortalClientId: ${Oidc__PortalClientId}
      Oidc__MetadataAddress: ${Oidc__MetadataAddress}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-http://localhost:5173}
      Database__RunDevelopmentSetup: ${Database__RunDevelopmentSetup:-true}
      Database__SeedDevelopmentData: ${Database__SeedDevelopmentData:-true}
      Logging__LogLevel__Default: ${Logging__LogLevel__Default:-Information}
      Ai__Enabled: ${Ai__Enabled:-false}
      Ai__Provider: ${Ai__Provider:-Fake}
      Ai__AzureOpenAI__Endpoint: ${Ai__AzureOpenAI__Endpoint:-}
      Ai__AzureOpenAI__ApiKey: ${Ai__AzureOpenAI__ApiKey:-}
      Ai__AzureOpenAI__ChatDeployment: ${Ai__AzureOpenAI__ChatDeployment:-gpt-4o-mini}
      Ai__AzureOpenAI__SupportsTemperature: ${Ai__AzureOpenAI__SupportsTemperature:-true}
      Ai__AzureOpenAI__SupportsMaxTokens: ${Ai__AzureOpenAI__SupportsMaxTokens:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - api-data-protection:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  portal:
    image: authorization-control-plane-portal:local
    container_name: acp-portal
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${Portal__ApiBaseUrl:-http://localhost:8080}
        VITE_OIDC_AUTHORITY: ${Portal__OidcAuthority:-http://localhost:8081/realms/authorization-local}
        VITE_OIDC_CLIENT_ID: ${Oidc__PortalClientId:-authorization-portal}
    environment:
      PORTAL_API_BASE_URL: ${Portal__ApiBaseUrl:-http://localhost:8080}
    ports:
      - "${PORTAL_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  api-data-protection:
  postgres-data:
